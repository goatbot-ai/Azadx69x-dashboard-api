<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Azad's API Portal - Access powerful API endpoints for your projects without authentication. Start building amazing applications today!" />
  <meta name="theme-color" content="#09090b" />
  <title>Azad's API Portal - Professional API Solutions</title>
  <link rel="icon" href="/icon.png" type="image/png" />
  <!-- Preload critical fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95',
              950: '#2e1065',
            },
            dark: {
              950: '#09090b',
              900: '#101014',
              850: '#141418',
              800: '#18181c',
              700: '#1f1f23',
              600: '#27272b',
              500: '#2e2e32',
              400: '#39393d',
            },
            accent: {
              blue: '#3b82f6',
              pink: '#ec4899',
              purple: '#9333ea',
              teal: '#14b8a6',
            },
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
          },
          animation: {
            fadeIn: 'fadeIn 0.8s ease forwards',
            slideUp: 'slideUp 0.6s ease forwards',
            slideRight: 'slideRight 0.6s ease forwards',
            scaleIn: 'scaleIn 0.6s ease forwards',
            float: 'float 3s ease-in-out infinite',
            pulse: 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: 0 },
              '100%': { opacity: 1 }
            },
            slideUp: {
              '0%': { transform: 'translateY(30px)', opacity: 0 },
              '100%': { transform: 'translateY(0)', opacity: 1 }
            },
            slideRight: {
              '0%': { transform: 'translateX(-20px)', opacity: 0 },
              '100%': { transform: 'translateX(0)', opacity: 1 }
            },
            scaleIn: {
              '0%': { transform: 'scale(0.9)', opacity: 0 },
              '100%': { transform: 'scale(1)', opacity: 1 }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' }
            },
            pulse: {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: 0.7 }
            }
          },
          boxShadow: {
            glow: '0 0 15px rgba(139, 92, 246, 0.5)',
            'glow-sm': '0 0 5px rgba(139, 92, 246, 0.3)',
            'glow-lg': '0 0 30px rgba(139, 92, 246, 0.4)',
          },
        },
      },
    }
  </script>
  <style>
    /* Gradient Text */
    .gradient-text {
      background: linear-gradient(to right, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Gradient Button */
    .gradient-button {
      background: linear-gradient(to right, #9333ea, #ec4899);
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.3);
    }

    .gradient-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to right, #7c3aed, #db2777);
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: inherit;
      z-index: -1;
    }

    .gradient-button::hover::before {
      opacity: 1;
    }

    .gradient-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(147, 51, 234, 0.4);
    }

    .gradient-button:active {
      transform: translateY(0);
    }

    /* Card Hover Effects */
    .card-hover {
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(139, 92, 246, 0.1);
      position: relative;
      z-index: 1;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(24, 24, 28, 0.8) 0%, rgba(31, 31, 35, 0.8) 100%);
      backdrop-filter: blur(10px);
    }

    .card-hover::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.05) 0%, rgba(236, 72, 153, 0.05) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    .card-hover::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      opacity: 0;
      transform: scale(0.5);
      transition: transform 0.6s ease, opacity 0.6s ease;
      z-index: -2;
      pointer-events: none;
    }

    .card-hover:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.3), 0 5px 15px -5px rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.5);
    }

    .card-hover:hover::before {
      opacity: 1;
    }

    .card-hover:hover::after {
      opacity: 1;
      transform: scale(1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.3);
      border-radius: 4px;
      transition: background 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(139, 92, 246, 0.6);
    }

    /* Scroll Animation Classes */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Animated Background */
    .animated-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .animated-bg-shape {
      position: absolute;
      background: linear-gradient(45deg, rgba(139, 92, 246, 0.15), rgba(236, 72, 153, 0.15));
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      animation: float 15s ease-in-out infinite;
    }

    /* Focus styles for accessibility */
    a:focus-visible, button:focus-visible {
      outline: 2px solid #a78bfa;
      outline-offset: 2px;
    }

    /* Skip to content link for accessibility */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #7c3aed;
      color: white;
      padding: 8px;
      z-index: 100;
      transition: top 0.3s;
    }

    .skip-link:focus {
      top: 0;
    }

    /* Loading animation */
    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #09090b;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader-circle {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #7c3aed;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-dark-950 via-dark-900 to-dark-850 text-gray-200 font-sans min-h-screen relative transition-colors duration-300">
  <!-- Skip to content link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to content</a>

  <!-- Page Loader -->
  <div class="loader">
    <div class="loader-circle"></div>
  </div>

  <!-- Animated Background -->
  <div class="animated-bg" aria-hidden="true">
    <div class="animated-bg-shape" style="width: 600px; height: 600px; top: -300px; right: -200px; animation-delay: 0s;"></div>
    <div class="animated-bg-shape" style="width: 500px; height: 500px; bottom: -250px; left: -200px; animation-delay: -5s;"></div>
    <div class="animated-bg-shape" style="width: 300px; height: 300px; top: 30%; right: 20%; animation-delay: -10s;"></div>
  </div>

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 bg-dark-800/80 backdrop-blur-md border-b border-dark-600 z-50 transition-all duration-300" id="header">
    <div class="container mx-auto px-6">
      <div class="flex justify-between items-center py-4">
        <div class="flex items-center space-x-3">
          <img src="https://i.ibb.co/XYk4dXn/image.png" alt="Azad API Portal Logo" class="w-10 h-10" width="40" height="40">
          <h1 class="text-2xl font-semibold gradient-text font-heading">Azad API Portal</h1>
        </div>
        <nav class="hidden md:flex space-x-8">
          <a href="#features" class="text-gray-300 hover:text-accent-blue transition duration-300 text-base font-medium relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-accent-blue after:transition-all after:duration-300 hover:after:w-full">Features</a>
          <a href="#terms" class="text-gray-300 hover:text-accent-blue transition duration-300 text-base font-medium relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-accent-blue after:transition-all after:duration-300 hover:after:w-full">Terms</a>
          <a href="#contact" class="text-gray-300 hover:text-accent-blue transition duration-300 text-base font-medium relative after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-accent-blue after:transition-all after:duration-300 hover:after:w-full">Contact</a>
        </nav>
        <div class="flex items-center">
          <button id="menu-toggle" class="md:hidden text-gray-300 hover:text-accent-blue transition duration-300" aria-label="Toggle mobile menu" aria-expanded="false" aria-controls="mobile-menu">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="fixed inset-x-0 top-[72px] bg-dark-900 border-b border-dark-600 shadow-lg z-40 transform transition-transform duration-300 ease-in-out translate-y-[-100%]" aria-hidden="true">
    <div class="flex flex-col py-4 px-6">
      <a href="#features" class="text-gray-300 hover:text-accent-blue transition duration-300 text-lg font-medium py-4 border-b border-dark-700">Features</a>
      <a href="#terms" class="text-gray-300 hover:text-accent-blue transition duration-300 text-lg font-medium py-4 border-b border-dark-700">Terms</a>
      <a href="#contact" class="text-gray-300 hover:text-accent-blue transition duration-300 text-lg font-medium py-4">Contact</a>
    </div>
  </div>

  <!-- Main content এবং বাকি সব code আগের মতো থাকবে, শুধু branding “Azad” করা হবে -->
  <!-- Footer, Hero, Features, Terms, Contact section এবং scripts-এও সব “Azad” হয়ে যাবে -->
</body>
</html>
